# Builds native apps for Android, Windows, macOS and Linux and attaches them to a
# GitHub Release. Trigger by pushing a tag:   git tag v1.0.0 && git push origin v1.0.0
# or run it manually from the Actions tab with a tag name.
#
# Asset names matter: the site's Downloads section maps them to platforms
# (see lib/core/github_releases.dart → DownloadPlatform.fromAssetName).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v1.0.0
        required: true

permissions:
  contents: write

# All builds use --no-tree-shake-icons: Flutter's icon tree-shaker misses
# Font Awesome icons referenced from const data (lib/data/portfolio_data.dart),
# which would ship GitHub/LinkedIn icons as empty boxes.

env:
  FLUTTER_VERSION: 3.47.7
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${TAG#v}" --build-number "${{ github.run_number }}" \
            --dart-define=APP_VERSION="$TAG" --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-release.apk portfolio-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: portfolio-android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        run: |
          flutter build windows --release \
            --build-name "${TAG#v}" --build-number "${{ github.run_number }}" \
            --dart-define=APP_VERSION="$TAG" --no-tree-shake-icons
      # Ship the MSVC runtime next to the exe so it starts on machines without
      # the Visual C++ Redistributable installed.
      - name: Package ZIP
        run: |
          RELEASE=build/windows/x64/runner/Release
          cp /c/Windows/System32/{msvcp140.dll,vcruntime140.dll,vcruntime140_1.dll} "$RELEASE/"
          7z a -tzip portfolio-windows-x64.zip "./$RELEASE/*"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: portfolio-windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        run: |
          flutter build macos --release \
            --build-name "${TAG#v}" --build-number "${{ github.run_number }}" \
            --dart-define=APP_VERSION="$TAG" --no-tree-shake-icons
      # Ad-hoc signed (no Apple Developer certificate), packaged as a
      # drag-to-Applications DMG. hdiutil is occasionally flaky on CI, so retry.
      - name: Package DMG
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Abhishek Choudhary" -srcfolder dmg -ov -format UDZO portfolio-macos.dmg && break
            echo "hdiutil failed (attempt $attempt), retrying…"; sleep 10
          done
          test -f portfolio-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: portfolio-macos.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        run: |
          flutter build linux --release \
            --build-name "${TAG#v}" --build-number "${{ github.run_number }}" \
            --dart-define=APP_VERSION="$TAG" --no-tree-shake-icons
          tar -czf portfolio-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: portfolio-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [android, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Portfolio ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
