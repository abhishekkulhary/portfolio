<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /portfolio/` in CI. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abhishek Choudhary — Full-Stack Software Engineer</title>
  <meta name="description" content="Portfolio of Abhishek Choudhary, a full-stack software engineer building production systems with Java, Spring, Angular and Flutter.">
  <meta name="author" content="Abhishek Choudhary">
  <meta name="theme-color" content="#05070D">

  <!-- Link previews (LinkedIn, Slack, messengers). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Abhishek Choudhary — Full-Stack Software Engineer">
  <meta property="og:description" content="Java · Spring · Angular · Flutter. Production systems, integrations and cross-platform apps.">
  <meta property="og:url" content="https://abhishekkulhary.github.io/portfolio/">
  <meta property="og:image" content="https://abhishekkulhary.github.io/portfolio/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Abhishek C.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #05070D; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 40%, #0b1a2b 0%, #05070D 60%);
      color: #8A96AD; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .2em; transition: opacity .4s ease;
    }
    #splash .ring {
      width: 64px; height: 64px; border-radius: 50%;
      background: conic-gradient(#22D3EE, #8B5CF6, #F472B6, #22D3EE);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: spin 1.1s linear infinite; filter: drop-shadow(0 0 12px rgba(34, 211, 238, .55));
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { #splash .ring { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="ring"></div>
    <div>LOADING PORTFOLIO</div>
  </div>
  <noscript>
    <p style="color:#E6EDF7;font-family:sans-serif;padding:24px">
      This portfolio is a Flutter web app and needs JavaScript.
      Abhishek Choudhary — Full-Stack Software Engineer —
      <a style="color:#22D3EE" href="https://www.linkedin.com/in/abhishekkulhary">LinkedIn</a>
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
